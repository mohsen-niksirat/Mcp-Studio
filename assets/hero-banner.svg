<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="20" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Glow Orb -->
  <circle cx="600" cy="180" r="160" fill="#4f46e5" opacity="0.18" filter="url(#glow)"/>
  <circle cx="950" cy="80" r="120" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350"/>
    <path d="M 150,0 L 150,420 M 300,0 L 300,420 M 450,0 L 450,420 M 600,0 L 600,420 M 750,0 L 750,420 M 900,0 L 900,420 M 1050,0 L 1050,420"/>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(560, 45)">
    <rect width="80" height="80" rx="22" fill="url(#brandGrad)" />
    <path d="M 28,40 L 40,24 L 52,40 L 40,56 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="40" cy="40" r="6" fill="#1e1b4b"/>
  </g>

  <!-- Title Text -->
  <text x="600" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="48" fill="#ffffff" letter-spacing="-1">
    MCP-Studio
  </text>

  <!-- Tagline Text -->
  <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="0">
    The Visual IDE &amp; Testing Studio for Model Context Protocol
  </text>
  <text x="600" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#818cf8" letter-spacing="0.5">
    The Open-Source "Postman" for AI Agents &amp; Tool Servers
  </text>

  <!-- Feature Pills -->
  <g transform="translate(180, 290)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="185" height="42" rx="12" fill="#131b2e" stroke="#334155" stroke-width="1.2"/>
      <text x="92" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#38bdf8">🤖 AI Chat Sandbox</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(210, 0)">
      <rect width="200" height="42" rx="12" fill="#131b2e" stroke="#334155" stroke-width="1.2"/>
      <text x="100" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#a5b4fc">🛠️ Dynamic Schema Forms</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(435, 0)">
      <rect width="195" height="42" rx="12" fill="#131b2e" stroke="#334155" stroke-width="1.2"/>
      <text x="97" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#34d399">📡 Live JSON-RPC Stream</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(655, 0)">
      <rect width="185" height="42" rx="12" fill="#131b2e" stroke="#334155" stroke-width="1.2"/>
      <text x="92" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#f472b6">⚡ Windows .EXE + Web</text>
    </g>
  </g>

  <!-- Bottom Version & Protocol Badge -->
  <g transform="translate(505, 365)">
    <rect width="190" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="95" y="17" text-anchor="middle" font-family="monospace" font-size="11" font-weight="500" fill="#cbd5e1">Protocol 2024-11-05 • v1.0.0</text>
  </g>
</svg>
