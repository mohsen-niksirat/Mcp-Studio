name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pnpm 11 requires Node >= 22.13 (node:sqlite), so Node 20
          # installs with pnpm 10 (compatible with the v9 lockfile).
          - node-version: 20
            pnpm-version: 10
          - node-version: 22
            pnpm-version: 11.13.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm --filter mcp-studio-server typecheck

      - name: Typecheck client
        run: pnpm --filter mcp-studio-client typecheck

      - name: Backend tests
        run: pnpm --filter mcp-studio-server test

      - name: Client tests
        run: pnpm --filter mcp-studio-client test

      # Coverage runs the same suites under instrumentation; only the
      # newest leg uploads, so the matrix stays fast.
      - name: Server coverage
        if: matrix.node-version == 22
        run: pnpm --filter mcp-studio-server test:coverage

      - name: Client coverage
        if: matrix.node-version == 22
        run: pnpm --filter mcp-studio-client test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v4
        with:
          files: server/coverage/lcov.info,client/coverage/lcov.info
          # Tokenless uploads work for public repos but can be rate-limited;
          # never block CI on the upload itself.
          fail_ci_if_error: false

      - name: Build client
        run: pnpm --filter mcp-studio-client build
